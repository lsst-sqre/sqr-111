# Resources for routing and authenticating traffic to echo-server using the
# kgateway controller
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-server-kgateway
  namespace: echo-server
spec:
  parentRefs:
    - name: kgateway-proxy
      namespace: kgateway-system
  hostnames:
    - "echo-server-kgateway.example.com"
  rules:
    - backendRefs:
        - name: echo-server
          port: 8000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  namespace: echo-server
  name: echo-server-auth
spec:
  type: ExtAuth
  extAuth:
    headersToForward:
      - authorization
    httpService:
      pathPrefix: "/ingress/auth"
      authorizationResponse:
        headersToClient:
          - x-auth-to-client-denied
        headersToClientOnSuccess:
          - x-auth-to-client-allowed
        headersToBackend:
          - x-auth-to-upstream-allowed
          - authorization
      backendRef:
        namespace: auth-server
        name: auth-server
        port: 8000
---
# Note this is in the auth-server namespace, NOT the echo-server namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-echo-server-to-auth-server
  namespace: auth-server
spec:
  from:
    - group: gateway.kgateway.dev
      kind: GatewayExtension
      namespace: echo-server
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  namespace: echo-server
  name: echo-server-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: echo-server-kgateway
  extAuth:
    extensionRef:
      namespace: echo-server
      name: echo-server-auth
