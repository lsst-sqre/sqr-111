controller:
  allowSnippetAnnotations: true
  config:
    annotations-risk-level: Critical
    server-snippet: |
      set $auth_error_body '';
      set $auth_ratelimit_limit '';
      set $auth_ratelimit_remaining '';
      set $auth_ratelimit_reset '';
      set $auth_ratelimit_resource '';
      set $auth_ratelimit_used '';
      set $auth_retry_after '';
      set $auth_status '';
      set $auth_www_authenticate '';
      set $auth_auth_to_client_allowed '';
      set $auth_auth_to_client_denied '';

      location @autherror {
        default_type application/json;
        if ($auth_status = 400) {
          add_header Cache-Control "no-cache, must-revalidate" always;
          add_header WWW-Authenticate $auth_www_authenticate always;
          add_header X-Auth-To-Client-Denied $auth_auth_to_client_denied always;
          return 400 $auth_error_body;
        }
        if ($auth_status = 401) {
          add_header Cache-Control "no-cache, must-revalidate" always;
          add_header WWW-Authenticate $auth_www_authenticate always;
          add_header X-Auth-To-Client-Denied $auth_auth_to_client_denied always;
          return 401 $auth_error_body;
        }
        if ($auth_status = 403) {
          add_header Cache-Control "no-cache, must-revalidate" always;
          add_header WWW-Authenticate $auth_www_authenticate always;
          add_header X-Auth-To-Client-Denied $auth_auth_to_client_denied always;
          return 403 $auth_error_body;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header WWW-Authenticate $auth_www_authenticate always;
        return 403;
      }
